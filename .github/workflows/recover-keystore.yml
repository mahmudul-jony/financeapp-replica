name: Recover Keystore Files

on:
  workflow_dispatch:
    inputs:
      zip_password:
        description: 'Set a password to encrypt the zip'
        required: true
        type: string

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Restore Keystore & Properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ZIP_PASS: ${{ inputs.zip_password }}
        run: |
          mkdir recovery_files
          echo "$KEYSTORE_BASE64" | base64 --decode > recovery_files/upload-keystore.jks

          cat > recovery_files/key.properties <<EOF
          storeFile=upload-keystore.jks
          keyAlias=upload
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          EOF

          zip -P "$ZIP_PASS" -r keystore-backup.zip recovery_files/

      - name: Upload Secure Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-secure-backup
          path: keystore-backup.zip
          retention-days: 1