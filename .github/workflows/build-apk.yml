
name: Build Finance App APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finance-app-versioning
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ github.token }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Increment Version Code
        id: version_info
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("pubspec.yaml")
          content = path.read_text(encoding="utf-8")

          pattern = r"(?m)^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$"
          match = re.search(pattern, content)

          if not match:
              raise SystemExit("ERROR: Could not read version from pubspec.yaml")

          version_name = match.group(1)
          build_number = int(match.group(2)) + 1
          full_version = f"{version_name}+{build_number}"

          updated = re.sub(
              pattern,
              f"version: {full_version}",
              content,
              count=1
          )

          path.write_text(updated, encoding="utf-8")

          print(f"Version updated to {full_version}")
          PY

          RAW_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          VERSION_NAME="${RAW_VERSION%%+*}"
          BUILD_NUMBER="${RAW_VERSION##*+}"
          FULL_VERSION="${VERSION_NAME}+${BUILD_NUMBER}"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "full_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${FULL_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Building version $FULL_VERSION"

      - name: Commit Version Update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pubspec.yaml

          git commit -m "Bump app version to ${{ steps.version_info.outputs.full_version }}"

          git push origin "HEAD:${{ github.ref_name }}"

      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          {
            echo "storeFile=upload-keystore.jks"
            echo "keyAlias=upload"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: financeapp-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.version_info.outputs.tag }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" \
              --title "Finance App $TAG" \
              --notes "Finance App release $TAG" \
              --latest
          fi

          cp build/app/outputs/flutter-apk/app-release.apk financeapp.apk

          gh release upload "$TAG" financeapp.apk --clobber
